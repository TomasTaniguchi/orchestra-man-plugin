name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: plugin/dist is up to date with src/
        run: git diff --exit-code -- plugin/dist || (echo "Run npm run build and commit plugin/dist" && exit 1)
